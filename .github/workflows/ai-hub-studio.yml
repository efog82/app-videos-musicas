name: AI Hub Studio — APK e testes
on:
  push:
    branches: [main]
    paths: ['ai-hub-studio/**', '.github/workflows/ai-hub-studio.yml']
  pull_request:
    paths: ['ai-hub-studio/**', '.github/workflows/ai-hub-studio.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aihub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    name: Servidor PC e exportação MP4
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-hub-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r server/requirements.txt
      - name: Testar API, segurança, failover e FFmpeg
        run: python -m unittest discover -s server/tests -v 2>&1 | tee server-tests.txt
        shell: bash -eo pipefail {0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AI-Hub-Studio-relatorio-servidor
          path: ai-hub-studio/server-tests.txt
  android:
    name: Android Kotlin Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ai-hub-studio/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Instalar SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar, testar e analisar Android
        run: gradle :core:test :app:assembleDebug :app:lintDebug --stacktrace --no-daemon
      - name: Verificar assinatura e preparar download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AI-Hub-Studio-v0.1.0-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/AI-Hub-Studio-v0.1.0-debug.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Hub-Studio-APK
          path: ai-hub-studio/android/dist/*
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AI-Hub-Studio-relatorios-Android
          path: |
            ai-hub-studio/android/core/build/reports/tests/
            ai-hub-studio/android/app/build/reports/

  android-device:
    name: Fluxo offline em emulador Android
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ai-hub-studio/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Permitir aceleração KVM no runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: ai-hub-studio/android
          script: gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AI-Hub-Studio-testes-emulador
          path: |
            ai-hub-studio/android/app/build/reports/androidTests/
            ai-hub-studio/android/app/build/outputs/androidTest-results/
